<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f8f6">
<title>Dayline — Simple App Planner</title>
<style>
:root{color-scheme:light;--bg:#f8f8f6;--paper:#fff;--ink:#20211f;--muted:#858780;--line:#e8e9e4;--soft:#f0f1ed;--accent:#20211f;--high:#c45b4d;--med:#a8792b;--low:#548264}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9da99a;outline-offset:2px}.app{max-width:760px;margin:0 auto;min-height:100vh;padding:30px 20px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px}.mark{width:35px;height:35px;background:var(--ink);color:white;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px}.brand-name{font-size:17px;font-weight:750;letter-spacing:-.6px}.brand-sub{font-size:11px;color:var(--muted)}.date-top{font-size:12px;color:var(--muted)}h1{font-size:29px;letter-spacing:-1.2px;margin:0 0 5px}h2{font-size:16px;letter-spacing:-.3px;margin:0}.muted{color:var(--muted)}.page{display:none}.page.active{display:block}.heading{margin-bottom:20px}.heading p{margin:0;color:var(--muted);font-size:13px}.app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.app-card{min-height:100px;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:15px;display:flex;flex-direction:column;justify-content:space-between;gap:15px;transition:transform .12s,border-color .12s}.app-card:hover{border-color:#c8cbc2;transform:translateY(-1px)}.app-card-top{display:flex;align-items:center;gap:10px}.app-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:var(--soft);font-size:15px;font-weight:700}.app-card-name{font-weight:650;font-size:14px;overflow-wrap:anywhere}.app-count{font-size:11px;color:var(--muted)}.new-app-card{border:1px dashed #c9cbc4;background:transparent;align-items:center;justify-content:center;gap:7px;color:var(--muted);min-height:100px}.plus{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:20px;color:var(--ink)}.section-label{font-size:11px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin:23px 0 9px}.app-header{display:flex;align-items:center;gap:11px;margin-bottom:19px}.back{width:35px;height:35px;border:1px solid var(--line);border-radius:11px;background:var(--paper);font-size:19px;flex-shrink:0}.app-title-wrap{flex:1;min-width:0}.app-title{font-size:24px;font-weight:750;letter-spacing:-.9px;overflow-wrap:anywhere}.app-sub{font-size:12px;color:var(--muted)}.small-btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;font-size:12px}.task-input{display:flex;gap:8px;padding:7px;background:var(--paper);border:1px solid var(--line);border-radius:13px;margin-bottom:16px}.task-input input{border:0;outline:0;background:transparent;min-width:0;flex:1;padding:8px}.task-input button{border:0;border-radius:9px;background:var(--ink);color:white;padding:8px 13px;font-weight:600}.task-list{display:flex;flex-direction:column;gap:0}.task{display:flex;align-items:center;gap:10px;padding:13px 3px;border-bottom:1px solid var(--line);min-width:0}.task-check{width:17px;height:17px;accent-color:var(--ink);flex-shrink:0}.task-content{flex:1;min-width:0}.task-name{font-size:13px;overflow-wrap:anywhere}.task.completed .task-name{text-decoration:line-through;color:var(--muted)}.task-meta{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:10px;color:var(--muted);flex-wrap:wrap}.priority{border-radius:5px;padding:2px 5px;background:var(--soft)}.priority.High{color:var(--high);background:#f8eae7}.priority.Medium{color:var(--med);background:#f7f0e2}.priority.Low{color:var(--low);background:#eaf1eb}.task-date{font-size:10px;color:var(--muted);white-space:nowrap}.task-edit{border:0;background:transparent;color:var(--muted);padding:6px;font-size:12px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}.date-area{margin-top:25px}.date-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.date-heading span{font-size:12px;color:var(--muted)}.date-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:thin;overscroll-behavior-x:contain}.date-chip{flex:0 0 57px;border:1px solid var(--line);background:var(--paper);border-radius:12px;min-height:69px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.date-chip .dow{font-size:10px;color:var(--muted);text-transform:uppercase}.date-chip .daynum{font-size:17px;font-weight:650}.date-chip .dot{width:4px;height:4px;border-radius:50%;background:transparent}.date-chip.has-tasks .dot{background:#879a83}.date-chip.selected{background:var(--ink);border-color:var(--ink);color:white}.date-chip.selected .dow{color:#d1d1ce}.date-chip.selected .dot{background:#fff}.strip-controls{display:flex;gap:5px}.strip-controls button{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:29px;height:29px}.bottom-note{font-size:10px;color:var(--muted);margin-top:20px;text-align:center}.modal{border:1px solid var(--line);border-radius:16px;padding:20px;width:min(390px,calc(100% - 24px));background:var(--paper);color:var(--ink)}.modal::backdrop{background:#2225}.modal h2{font-size:18px;margin-bottom:16px}.modal form{display:flex;flex-direction:column;gap:13px}.modal label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px}.modal input,.modal select{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--paper);color:var(--ink);width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:4px}.modal-actions button{border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:9px 12px}.modal-actions .save{background:var(--ink);color:white;border-color:var(--ink)}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:10px 14px;font-size:12px}
.top-right{display:flex;align-items:center;gap:10px;min-width:0}.account{display:flex;align-items:center;gap:7px;min-width:0}.avatar{width:28px;height:28px;border-radius:50%;background:var(--soft);object-fit:cover;flex-shrink:0}
@media(max-width:480px){.app{padding:21px 15px 35px}.app-grid{gap:8px}.app-card{padding:12px;min-height:93px}.app-card-name{font-size:13px}.app-header{gap:8px}.app-title{font-size:21px}.task-date{display:none}.date-chip{flex-basis:53px}.top{margin-bottom:25px}.date-top{display:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="mark">D</div><div><div class="brand-name">dayline</div><div class="brand-sub">A little more focus, every day</div></div></div>
    <div class="top-right">
      <div class="date-top" id="todayLabel"></div>
      <button class="small-btn" id="signInBtn">Sign in to sync</button>
      <div class="account hidden" id="account"><img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer"><button class="small-btn" id="signOutBtn">Sign out</button></div>
    </div>
  </header>

  <section class="page active" id="homePage">
    <div class="heading"><h1>Your apps</h1><p>Choose an app to see and plan its tasks.</p></div>
    <div class="app-grid" id="appsGrid"></div>
    <div class="bottom-note" id="syncNote">Your tasks stay saved in this browser. Sign in to sync across devices.</div>
  </section>

  <section class="page" id="tasksPage">
    <div class="app-header">
      <button class="back" id="backBtn" aria-label="Back to apps">‹</button>
      <div class="app-title-wrap"><div class="app-title" id="currentAppName"></div><div class="app-sub" id="taskCount"></div></div>
      <button class="small-btn" id="renameBtn">Rename</button>
    </div>
    <form class="task-input" id="addTaskForm">
      <input id="newTaskInput" placeholder="Add a task…" autocomplete="off" maxlength="180" aria-label="Task name">
      <button type="submit">Add</button>
    </form>
    <div class="task-list" id="taskList"></div>

    <section class="date-area">
      <div class="date-heading"><div><h2>Plan your days</h2><span id="selectedDateLabel">Choose a date</span></div><div class="strip-controls"><button id="prevDates" aria-label="Previous dates">‹</button><button id="todayDates" aria-label="Jump to today">Today</button><button id="nextDates" aria-label="Next dates">›</button></div></div>
      <div class="date-strip" id="dateStrip"></div>
    </section>
    <div class="bottom-note">Tap a date to plan that day. Tap a task to edit its priority or date.</div>
  </section>
</main>

<dialog class="modal" id="appModal">
  <form id="appForm"><h2 id="appModalTitle">Create an app</h2><label>App name<input id="appNameInput" required maxlength="80" placeholder="e.g. NEO Widgets"></label><div class="modal-actions"><button type="button" id="cancelApp">Cancel</button><button class="save" type="submit">Save app</button></div></form>
</dialog>
<dialog class="modal" id="taskModal">
  <form id="taskEditForm"><h2>Edit task</h2><label>Task name<input id="editTaskName" required maxlength="180"></label><label>Priority<select id="editPriority"><option>Medium</option><option>High</option><option>Low</option></select></label><label>Planned date<input id="editDate" type="date"></label><div class="modal-actions"><button type="button" id="deleteTask" style="margin-right:auto">Delete</button><button type="button" id="cancelEdit">Cancel</button><button class="save" type="submit">Save</button></div></form>
</dialog>
<div class="toast hidden" id="toast" role="status"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
const fb=initializeApp({apiKey:'AIzaSyApNf0fNTOEZCFKy_UVCSVk5IZbzwts7F4',authDomain:'dayline-planner-ekr.firebaseapp.com',projectId:'dayline-planner-ekr',storageBucket:'dayline-planner-ekr.firebasestorage.app',messagingSenderId:'1082509947433',appId:'1:1082509947433:web:cbe61c24a67caa179ba238'});
const auth=getAuth(fb),db=getFirestore(fb);
const KEY='dayline-simple-planner-v1';
const seedApps=[{id:'neo',name:'NEO Widgets',symbol:'N'},{id:'wallz',name:'Wallz',symbol:'W'},{id:'ai-me',name:'AI Me',symbol:'A'}];
const seedTasks=[
['Logo design','neo','High'],['Update old Free and Note Free widgets','neo','High'],['Add Lock Screen widgets','neo','High'],['Add wallpapers','neo','Medium'],['Review all existing widgets','neo','High'],['Add widgets to popular categories','neo','High'],['Plan continuous new widget development','neo','Medium'],['Update Vitamin D widget','neo','High'],['Improve App Store screenshots','neo','High'],['Improve iPad screenshots','neo','Medium'],['Add yearly In-App Purchase','neo','High'],['Add setup guide','neo','Medium'],['Add tap animations','neo','Medium'],['Redesign widget-adding screen','neo','High'],['Analyze Astro','neo','Low'],['Localize screenshots and metadata','neo','Medium'],['Create a marketing plan','neo','Medium'],['HealthKit widget','neo','High'],['Piano widget','neo','Medium'],['Drums widget','neo','Medium'],['Drum pad widget','neo','Medium'],['Event widget','neo','High'],['Asthma-related image widget','neo','Low'],['Focus widget','neo','Medium'],['Multi-Time-Zone widget','neo','Medium'],['Dynamic Island features','neo','Low'],['App Launcher widget','neo','High'],['Music widget','neo','Medium'],['Music-themed Clock + Weather widgets','neo','Medium'],['Quote widget','neo','Low'],['Bible and Quran widget','neo','Low'],['Reminder widget','neo','High'],['Note-taking widget','neo','Medium']
];
const $=id=>document.getElementById(id);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const dateObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const uid=()=>`t-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
let state={apps:[],tasks:[]},currentApp=null,selectedDate=today(),stripStart=null,editingTask=null,editingApp=null,toastTimer,user=null,unsubscribe=null;
const valid=x=>x&&Array.isArray(x.apps)&&Array.isArray(x.tasks);
const userDoc=()=>doc(db,'users',user.uid);
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{say('Could not save. Please check browser storage.')}}
function save(){saveLocal();if(user)setDoc(userDoc(),{apps:state.apps,tasks:state.tasks,updatedAt:Date.now()}).catch(()=>say('Could not sync. Changes are saved on this device.'))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(valid(x)){state=x;return}}catch{}state.apps=seedApps.map(x=>({...x}));state.tasks=seedTasks.map((t,i)=>({id:`seed-${i}`,title:t[0],appId:t[1],priority:t[2],date:'',done:false}));saveLocal()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1800)}
function appById(id){return state.apps.find(a=>a.id===id)}
function currentTasks(){return state.tasks.filter(t=>t.appId===currentApp).sort((a,b)=>Number(a.done)-Number(b.done)||({High:0,Medium:1,Low:2}[a.priority]-{High:0,Medium:1,Low:2}[b.priority]))}
function renderApps(){$('appsGrid').innerHTML=state.apps.map(a=>{const n=state.tasks.filter(t=>t.appId===a.id&&!t.done).length;return `<button class="app-card" data-open="${esc(a.id)}"><span class="app-card-top"><span class="app-icon">${esc(a.symbol||a.name.slice(0,1).toUpperCase())}</span><span class="app-card-name">${esc(a.name)}</span></span><span class="app-count">${n} open task${n===1?'':'s'} <span style="float:right">↗</span></span></button>`}).join('')+`<button class="app-card new-app-card" id="newAppCard"><span class="plus">+</span><span>Create new app</span></button>`;$('newAppCard').addEventListener('click',()=>openAppModal())}
function showHome(){$('homePage').classList.add('active');$('tasksPage').classList.remove('active');currentApp=null;renderApps()}
function showTasks(appId){if(!appById(appId))return;currentApp=appId;$('homePage').classList.remove('active');$('tasksPage').classList.add('active');renderTasks();renderDates();$('newTaskInput').focus()}
function refresh(){if(currentApp&&appById(currentApp)){renderTasks();renderDates()}else showHome()}
function renderTasks(){const app=appById(currentApp);if(!app)return;$('currentAppName').textContent=app.name;const ts=currentTasks();$('taskCount').textContent=`${ts.filter(t=>!t.done).length} remaining · ${ts.length} total`;$('taskList').innerHTML=ts.map(t=>`<div class="task ${t.done?'completed':''}"><input class="task-check" type="checkbox" data-check="${esc(t.id)}" ${t.done?'checked':''} aria-label="Complete ${esc(t.title)}"><div class="task-content" data-edit="${esc(t.id)}" style="cursor:pointer"><div class="task-name">${esc(t.title)}</div><div class="task-meta"><span class="priority ${esc(t.priority)}">${esc(t.priority)}</span>${t.date?`<span>${esc(dateObj(t.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</span>`:''}</div></div><button class="task-edit" data-edit="${esc(t.id)}" aria-label="Edit task">•••</button></div>`).join('')||'<div class="empty">No tasks yet. Add your first task above.</div>'}
function renderDates(){const selected=dateObj(selectedDate);$('selectedDateLabel').textContent=selected.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});if(!stripStart)stripStart=new Date(selected);let start=new Date(stripStart);let html='';for(let i=0;i<14;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d);const has=state.tasks.some(t=>t.appId===currentApp&&t.date===key&&!t.done);html+=`<button class="date-chip ${key===selectedDate?'selected':''} ${has?'has-tasks':''}" data-date="${key}"><span class="dow">${d.toLocaleDateString(undefined,{weekday:'short'})}</span><span class="daynum">${d.getDate()}</span><span class="dot"></span></button>`}$('dateStrip').innerHTML=html}
function openAppModal(app=null){editingApp=app?.id||null;$('appModalTitle').textContent=app?'Rename app':'Create an app';$('appNameInput').value=app?.name||'';$('appModal').showModal();setTimeout(()=>$('appNameInput').focus(),30)}
function openTaskModal(task){editingTask=task.id;$('editTaskName').value=task.title;$('editPriority').value=task.priority||'Medium';$('editDate').value=task.date||'';$('taskModal').showModal()}
function renderAccount(){$('signInBtn').classList.toggle('hidden',!!user);$('account').classList.toggle('hidden',!user);$('avatar').src=user?.photoURL||'';$('avatar').title=user?.email||'';$('syncNote').textContent=user?`Synced with ${user.email||'your account'}.`:'Your tasks stay saved in this browser. Sign in to sync across devices.'}
$('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
$('appsGrid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)showTasks(b.dataset.open)});
$('backBtn').addEventListener('click',showHome);
$('addTaskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('newTaskInput').value.trim();if(!title)return;state.tasks.push({id:uid(),title,appId:currentApp,priority:'Medium',date:selectedDate,done:false});$('newTaskInput').value='';save();renderTasks();renderDates();say('Task added')});
$('taskList').addEventListener('change',e=>{const id=e.target.dataset.check;if(!id)return;const t=state.tasks.find(t=>t.id===id);if(t){t.done=e.target.checked;save();renderTasks();renderDates();if(document.querySelector('.page.active')===$('homePage'))renderApps()}});
$('taskList').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b){const t=state.tasks.find(t=>t.id===b.dataset.edit);if(t)openTaskModal(t)}});
$('dateStrip').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(!b)return;selectedDate=b.dataset.date;renderDates();say('Selected '+dateObj(selectedDate).toLocaleDateString(undefined,{month:'short',day:'numeric'}))});
$('prevDates').addEventListener('click',()=>{stripStart=new Date(stripStart||dateObj(selectedDate));stripStart.setDate(stripStart.getDate()-7);renderDates()});
$('nextDates').addEventListener('click',()=>{stripStart=new Date(stripStart||dateObj(selectedDate));stripStart.setDate(stripStart.getDate()+7);renderDates()});
$('todayDates').addEventListener('click',()=>{selectedDate=today();stripStart=new Date();renderDates()});
$('taskEditForm').addEventListener('submit',e=>{e.preventDefault();const t=state.tasks.find(t=>t.id===editingTask);if(t){t.title=$('editTaskName').value.trim();t.priority=$('editPriority').value;t.date=$('editDate').value;save();$('taskModal').close();renderTasks();renderDates();say('Task updated')}});
$('cancelEdit').addEventListener('click',()=>$('taskModal').close());
$('deleteTask').addEventListener('click',()=>{if(!confirm('Delete this task?'))return;state.tasks=state.tasks.filter(t=>t.id!==editingTask);save();$('taskModal').close();renderTasks();renderDates();say('Task deleted')});
$('renameBtn').addEventListener('click',()=>openAppModal(appById(currentApp)));
$('appForm').addEventListener('submit',e=>{e.preventDefault();const name=$('appNameInput').value.trim();if(!name)return;if(state.apps.some(a=>a.name.toLowerCase()===name.toLowerCase()&&a.id!==editingApp)){say('An app with that name already exists');return}if(editingApp){const a=appById(editingApp);if(a){a.name=name;a.symbol=name.slice(0,1).toUpperCase()}}else{const a={id:uid(),name,symbol:name.slice(0,1).toUpperCase()};state.apps.push(a);save();$('appModal').close();renderApps();showTasks(a.id);return}save();$('appModal').close();renderTasks();renderApps()});
$('cancelApp').addEventListener('click',()=>$('appModal').close());
$('signInBtn').addEventListener('click',()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err=>{if(err.code!=='auth/popup-closed-by-user'&&err.code!=='auth/cancelled-popup-request')say('Sign-in failed. Please try again.')}));
$('signOutBtn').addEventListener('click',()=>signOut(auth).then(()=>say('Signed out')));
// The first sign-in on a fresh account uploads this browser's tasks; after that the cloud copy wins and streams live.
onAuthStateChanged(auth,async u=>{unsubscribe?.();unsubscribe=null;user=u;renderAccount();if(!u)return;try{const snap=await getDoc(userDoc());if(!valid(snap.data()))save();unsubscribe=onSnapshot(userDoc(),s=>{const x=s.data();if(s.metadata.hasPendingWrites||!valid(x))return;state={apps:x.apps,tasks:x.tasks};saveLocal();refresh()})}catch{say('Could not reach sync. Working offline.')}});
load();showHome();renderAccount();
</script>
</body>
</html>
